# Servidor
# Obligatorio: sin cognito.properties (generado por aws-scripts/cognito.sh) la aplicacion no arranca.
spring.config.import=classpath:cognito.properties
server.port=8080

# Base de Datos H2
spring.datasource.url=jdbc:h2:mem:eventhubdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola H2: desactivada en produccion. Se habilita con el perfil 'dev'.
spring.h2.console.enabled=false

# JPA / Hibernate (Generación automática del esquema)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# OpenAPI / Swagger UI: desactivado en produccion. Se habilita con el perfil 'dev'.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
